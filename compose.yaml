# A normal Compose file. Everything this tool adds lives where Compose puts
# extensions: x-containerctl blocks, and containerctl.* labels on a service.
name: platform

# No top-level x-containerctl block: this project uses the machine's default
# domain. Pin one here only when this project needs a domain of its own:
#
#   x-containerctl:
#     domain: shop.test

services:
  platform1:
    image: node:26.8.1-trixie-slim
    # The server below listens on 80, so that is the port declared.
    expose: ["80"]
    # served at https://platform1.test/
    x-containerctl:
      domains: [platform1.test]
    command:
      - node
      - -e
      - |-
        require('http').createServer((q,s)=>s.end('served by '+require('os').hostname()+' for '+q.headers.host+'\n')).listen(80)

  platform2:
    image: node:26.8.1-trixie-slim
    # The server below listens on 80, so that is the port declared.
    expose: ["80"]
    x-containerctl:
      domains: [platform2.test]
    command:
      - node
      - -e
      - |-
        require('http').createServer((q,s)=>s.end('served by '+require('os').hostname()+' for '+q.headers.host+'\n')).listen(80)

  platform3:
    image: node:26.8.1-trixie-slim
    # The server below listens on 80, so that is the port declared.
    expose: ["80"]
    # one container served at two names
    x-containerctl:
      domains: [api.platform3.test, admin.platform3.test]
    command:
      - node
      - -e
      - |-
        require('http').createServer((q,s)=>s.end('served by '+require('os').hostname()+' for '+q.headers.host+'\n')).listen(80)
